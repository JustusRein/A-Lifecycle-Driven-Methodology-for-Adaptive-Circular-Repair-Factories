
gripper:
  name: "Double_Schmalz_ECG"
  
  # Visual: Path for the detailed visual mesh (if available)
  visual_mesh_path: null
  
  # Collision: Path for the detailed collision mesh (if available)
  collision_mesh_path: null

  # --- PADS ---
  # 2 cirles suction cups side by side
  pad_height: 0.015  # Altura das ventosas
  pads:
    - type: "circle"
      name: "left_cup"
      # 4cm to the left of center
      offset: [0.0, 0.0, 0.0] 
      radius: 0.010 # 20mm raio

      thickness: 0.002          # Absolute thickness of the ring
      relative_thickness: false # Thickness mode (absolute or relative)
      max_sealing_distance: 0.0005

      zones:
        num_angular_sections: 8
        num_radial_sections: 2
      # length: 0.05 # 5mm de comprimento
    #

  # --- BODY CONFIG ---
  # The main gripper body that holds the suction cups
  body:
    radius: 0.015   # Raio do corpo que segura as ventosas
    length: 0.02  # Comprimento total do corpo

  # --- SAFETY PARAMETERS ---
  safety:
    standoff_distance: 0.05 # Distância de aproximação (Pre-grasp)
    collision_margin: 0.05  # Margem extra de 5% nas colisões
  grasp_strategy: 'single'
