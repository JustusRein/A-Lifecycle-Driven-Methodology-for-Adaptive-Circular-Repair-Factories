# Sampling & Geometry
num_samples: 800
raycasting_hull_type: "alpha"
raycasting_hemisphere_only: false

# Colisões e Segurança
approach_distance: 0.10
local_clearence_margin: 0.015
safety_volume_shape: "gripper_shape" #"bounding_box_shape", "extended_body_shape", "gripper_shape"
# collision_margin: 0.10

# Rotação e Estratégia
rotation_strategy: "uniform"
rotation_step_deg: 60
rotation_range_deg: 180
max_angle_deg: 45.0

# Avaliação (Scoring)
min_score: 0.3
weight_seal: 0.40
weight_verticality: 0.30
weight_torque: 0.30
score_aggregation_method: "min"
debug_score: true
