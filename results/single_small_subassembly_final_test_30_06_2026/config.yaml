# Sampling & Geometry
raycasting_samples:
  sphere: 200
  top_down: 400
raycasting_hull_type: "alpha"
raycasting_hemisphere_only: false

# Colisões e Segurança
approach_distance: 0.10
local_clearence_margin: 0.001
safety_volume_shape: "extended_body_shape" #"bounding_box_shape", "extended_body_shape", "gripper_shape"
# safety_volume_shape: "extended_body_shape" #"bounding_box_shape", "extended_body_shape", "gripper_shape"
# collision_margin: 0.10

# Rotação e Estratégia
rotation_strategy: "fixed"
# rotation_strategy: "uniform"
rotation_step_deg: 45
rotation_range_deg: 90
# max_angle_deg: 45.0
max_angle_deg: 60.0 # for conservative approach

# Avaliação (Scoring)
# min_score: 0.3
min_score: 0.0 # for conservative approach
weight_seal: 0.35
weight_verticality: 0.35
weight_torque: 0.30
# min_seal_threshold: 0.2
min_seal_threshold: 0.0 # for conservative approach
score_aggregation_method: "min"
debug_score: true
debug_view_raycasting: True
debug_hull_generation: True
verticality_decay: 0.5
