gripper:
  name: "Double_Schmalz_ECG"
  
  # Visual: Path for the detailed visual mesh (if available)
  visual_mesh_path: null
  
  # Collision: Path for the detailed collision mesh (if available)
  collision_mesh_path: null

  # --- PADS ---
  # 2 cirles suction cups side by side
  pads:
    - type: "circle"
      name: "left_cup"
      # 4cm to the left of center
      offset: [-0.04, 0.0, 0.0] 
      radius: 0.020 # 20mm raio
      length: 0.025 # 5mm de comprimento

    - type: "circle"
      name: "right_cup"
      # 4cm to the right of center
      offset: [0.04, 0.0, 0.0]
      radius: 0.020
      length: 0.025 # 5mm de comprimento

    - type: "rect"
      name: "middle_pad"
      offset: [0.0, 0.0, 0.0]
      width: 0.02   # 2cm de largura
      height: 0.04  # 4cm de altura
      length: 0.025  # 1cm de comprimento

  # --- BODY CONFIG ---
  # The main gripper body that holds the suction cups
  body:
    radius: 0.06   # Raio do corpo que segura as ventosas
    length: 0.10   # Comprimento total do corpo

  # --- SAFETY PARAMETERS ---
  safety:
    standoff_distance: 0.05 # Distância de aproximação (Pre-grasp)
    collision_margin: 0.05  # Margem extra de 5% nas colisões
